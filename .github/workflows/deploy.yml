name: Deploy MTA to CF

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MBT + CF CLI
        run: |
          npm install -g mbt
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&source=github" -o cf-cli.tgz
          sudo mkdir -p /usr/local/cf-cli
          sudo tar -xzf cf-cli.tgz -C /usr/local/cf-cli
          echo "/usr/local/cf-cli" >> $GITHUB_PATH
          /usr/local/cf-cli/cf version

      - name: Build MTA
        run: mbt build

      - name: CF Login
        run: |
          cf login -a ${{ secrets.CF_API }} \
                   -u ${{ secrets.CF_USERNAME }} \
                   -p ${{ secrets.CF_PASSWORD }} \
                   -o ${{ secrets.CF_ORG }} \
                   -s ${{ secrets.CF_SPACE }}

      - name: Install MultiApps Plugin
        run: |
          cf install-plugin -r CF-Community "multiapps plugin" -f

      - name: Deploy MTA
        run: cf deploy mta_archives/*.mtar